<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinalStage — панель</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>FinalStage</h1>
  <input id="key" placeholder="ADMIN_KEY" style="flex:1">
  <button id="saveKey">Сохранить</button>
  <span id="conn" class="badge">offline</span>
</header>
<main>
  <aside>
    <h2>Устройства</h2>
    <ul id="devices"></ul>
    <hr>
    <h2>Показ на экране</h2>
    <label>Фото</label>
    <input type="file" id="photo" accept="image/*">
    <label>Видео</label>
    <input type="file" id="video" accept="video/*">
    <label>Секунд (0 = показывать до кнопки Скрыть)</label>
    <input type="number" id="dur" value="0" min="0">
    <p><button id="hide">Скрыть</button></p>
    <p id="pushStatus" class="muted"></p>
  </aside>
  <section>
    <canvas id="screen"></canvas>
    <p class="muted" id="devInfo">Устройство не выбрано</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
